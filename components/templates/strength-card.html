<div class="strength-card no-modal animate-on-scroll" data-strength="{{title}}">
    <div class="strength-header">
        <div class="strength-name">{{emoji}} {{title}}</div>
    </div>
    <p class="small">Click to see details</p>
    <div class="strength-details">
        <ul>
            {{points}}
        </ul>
    </div>
</div>
